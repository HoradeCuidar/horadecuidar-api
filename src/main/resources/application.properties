spring.application.name=hdc

spring.profiles.active=${ACTIVE_PROFILE:prod}

spring.flyway.enabled=true

spring.config.import=optional:file:.env[.properties]

frontend.url=${FRONTEND_URL:http://localhost:5173}

api.security.token.secret=${JWS_SECRET}

cloudflare.r2.account-id=${R2_ACCOUNT_ID}
cloudflare.r2.access-key=${R2_ACCESS_KEY}
cloudflare.r2.secret-key=${R2_SECRET_KEY}
cloudflare.r2.bucket=hdc-images
cloudflare.r2.region=auto

spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

admin.address=${ADMIN_ADDRESS:admin@gmail.com}

# Swagger
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs

# Resend
resend.api.key=${RESEND_API_KEY}
resend.api.base-url=${RESEND_API_BASE_URL:https://api.resend.com}
resend.mail.from=${RESEND_MAIL_FROM}
resend.api.connect-timeout=5s
resend.api.read-timeout=10s
